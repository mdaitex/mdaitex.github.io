<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDAITex ahora es EdiMarkWeb</title>
  <meta http-equiv="refresh" content="5;url=https://edimarkweb.github.io/">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    :root {
      color-scheme: light dark;
      --bg-color: #f6f8fb;
      --bg-color-dark: #0f172a;
      --text-color: #1f2937;
      --text-color-dark: #e2e8f0;
      --highlight-color: #2563eb;
      --shadow-color: rgba(15, 23, 42, 0.2);
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: var(--bg-color-dark);
        color: var(--text-color-dark);
      }
      .card {
        background: rgba(15, 23, 42, 0.65);
        box-shadow: 0 12px 30px rgba(2, 6, 23, 0.6);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      background: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .card {
      max-width: 520px;
      width: 100%;
      background: #ffffff;
      border-radius: 18px;
      padding: 40px 32px;
      box-shadow: 0 20px 40px var(--shadow-color);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .highlight {
      color: var(--highlight-color);
      font-weight: 600;
    }

    p {
      margin-bottom: 12px;
      font-size: 1rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      margin-top: 12px;
      border-radius: 999px;
      background: var(--highlight-color);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }

    .countdown {
      font-size: 0.95rem;
      margin-top: 16px;
      opacity: 0.85;
    }

    noscript {
      display: block;
      margin-top: 16px;
      font-size: 0.9rem;
      color: #d97706;
    }
  </style>
</head>
<body>
  <main class="card" role="main" aria-live="polite">
    <h1>MDAITex ahora es <span class="highlight">EdiMarkWeb</span></h1>
    <p>Actualiza tus favoritos para seguir disfrutando del editor.</p>
    <p>Serás redirigido automáticamente en breves instantes.</p>
    <p class="countdown">Redirigiendo en <span id="countdown">5</span> segundos…</p>
    <a class="cta" href="https://edimarkweb.github.io/" rel="noopener">Ir a EdiMarkWeb ahora</a>
    <noscript>La redirección automática requiere JavaScript. Haz clic en el botón para continuar.</noscript>
  </main>

  <script>
    const targetUrl = 'https://edimarkweb.github.io/';
    const delaySeconds = 5;
    const countdownEl = document.getElementById('countdown');

    function redirect() {
      window.location.href = targetUrl;
    }

    function startCountdown() {
      let remaining = delaySeconds;
      if (countdownEl) {
        countdownEl.textContent = String(remaining);
      }

      const intervalId = window.setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          window.clearInterval(intervalId);
          redirect();
          return;
        }
        if (countdownEl) {
          countdownEl.textContent = String(remaining);
        }
      }, 1000);

      window.setTimeout(redirect, delaySeconds * 1000);
    }

    window.addEventListener('DOMContentLoaded', startCountdown);
  </script>
</body>
</html>
